<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Narrative Notion</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

/* GENERAL */
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    color: #333;
    overflow-x: hidden;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 1000;
}
.logo {
    font-family: 'Dancing Script', cursive;
    font-size: 38px;
    background: linear-gradient(45deg, #ff6b6b, #c0392b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
}

/* SLIDER */
.slider {
    width: 90%;
    max-width: 1200px;
    height: 500px;
    margin: 40px auto;
    border-radius: 20px;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    overflow: hidden;
}
.slide { 
    display: none; 
    transition: opacity 0.5s ease-in-out;
    opacity: 0;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
.slide img { width:100%; height:100%; object-fit:cover; }
.slide.active { 
    display: block; 
    opacity: 1;
}

.prev, .next {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background: rgba(255, 255, 255, 0.7);
    border:none;
    padding: 15px 20px;
    cursor:pointer;
    font-size: 24px;
    border-radius: 50%;
    transition: background 0.3s, transform 0.3s;
    backdrop-filter: blur(5px);
    z-index: 10;
}
.prev:hover, .next:hover {
    background: rgba(255, 255, 255, 1);
    transform: translateY(-50%) scale(1.1);
}
.prev { left: 20px; }
.next { right: 20px; }

/* SECTIONS */
.section {
    width: 90%;
    max-width: 1200px;
    margin: 60px auto;
}
.section h2 {
    font-family: 'Dancing Script';
    font-size: 42px;
    text-align: center;
    margin-bottom: 40px;
    color: #2c3e50;
    position: relative;
}
.section h2::after {
    content: '';
    width: 60px;
    height: 3px;
    background: #e74c3c;
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
}

/* SEARCH */
.controls {
    text-align:center;
    margin-bottom: 40px;
    display: flex;
    justify-content: center;
    gap: 15px;
}
.controls input, .controls select {
    padding: 12px 20px;
    border: 1px solid #ddd;
    border-radius: 30px;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    outline: none;
    transition: box-shadow 0.3s, border-color 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
.controls input:focus, .controls select:focus {
    box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
    border-color: #e74c3c;
}
.controls input {
    width: 300px;
}

/* BOOKS */
.book-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 30px;
    justify-content: center;
}
.book {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    transition: transform 0.3s, box-shadow 0.3s;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.book:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}
.book img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.5s;
}
.book:hover img {
    transform: scale(1.05);
}
.book h3 {
    font-size: 20px;
    margin: 15px 0 5px;
    color: #34495e;
}
.book p {
    color: #e74c3c;
    font-weight: bold;
    font-size: 18px;
    margin: 0 0 15px;
}

/* BUTTON */
button {
    padding: 10px 25px;
    border: none;
    background: linear-gradient(45deg, #e74c3c, #c0392b);
    color: white;
    cursor: pointer;
    border-radius: 25px;
    font-family: 'Playfair Display', serif;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
    box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
}
button:hover {
    background: linear-gradient(45deg, #c0392b, #a53125);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
}
button:active {
    transform: translateY(0);
}

/* CART */
#cartContainer { 
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
}
.total {
    font-size: 24px;
    margin-top: 30px;
    text-align: right;
    font-weight: bold;
    color: #2c3e50;
    padding-right: 20px;
}
.checkout-btn-wrapper {
    display: flex;
    justify-content: flex-end;
    margin-right: 20px;
}

/* POPUP */
#popup {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #2c3e50;
    color: white;
    padding: 15px 25px;
    border-radius: 30px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    opacity: 0;
    transition: opacity 0.4s, transform 0.4s;
    transform: translateY(20px);
    z-index: 2000;
}

/* FOOTER */
footer {
    text-align:center;
    padding: 30px;
    background: #2c3e50;
    color: #ecf0f1;
    margin-top: 60px;
}

</style>
</head>
<body>

<header>
    <div class="logo">The Narrative Notion</div>
</header>

<!-- POPUP -->
<div id="popup"></div>

<!-- SLIDER -->
<div class="slider">
    <div class="slide active"><img src="https://images.unsplash.com/photo-1512820790803-83ca734da794"></div>
    <div class="slide"><img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f"></div>
    <div class="slide"><img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d"></div>

    <button class="prev" onclick="changeSlide(-1)">❮</button>
    <button class="next" onclick="changeSlide(1)">❯</button>
</div>

<!-- SEARCH -->
<div class="controls">
    <input type="text" id="searchInput" placeholder="Search books...">
    <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="popular">Popular</option>
        <option value="fantasy">Fantasy</option>
    </select>
</div>

<!-- POPULAR -->
<section class="section">
    <h2>Popular Picks</h2>
    <div class="book-container" id="popularContainer"></div>
</section>

<!-- FANTASY -->
<section class="section">
    <h2>Fantasy Books</h2>
    <div class="book-container" id="fantasyContainer"></div>
</section>

<!-- CART -->
<section class="section">
    <h2>Your Cart</h2>
    <div id="cartContainer"></div>
    <div class="total" id="totalAmount"></div>
    <div class="checkout-btn-wrapper">
        <button onclick="checkout()">Checkout</button>
    </div>
</section>

<footer>
    © 2026 The Narrative Notion
</footer>

<script>

/* SLIDER */
let currentSlide=0;
const slides=document.querySelectorAll(".slide");

function showSlide(i){
    slides.forEach(s=>s.classList.remove("active"));
    slides[i].classList.add("active");
}
function changeSlide(d){
    currentSlide+=d;
    if(currentSlide<0) currentSlide=slides.length-1;
    if(currentSlide>=slides.length) currentSlide=0;
    showSlide(currentSlide);
}

/* BOOK DATA */
const popularBooks=[
    {title:"The Silent Garden",category:"popular",price:499,img:"https://images.unsplash.com/photo-1544947950-fa07a98d237f"},
    {title:"Whispers of Autumn",category:"popular",price:399,img:"https://images.unsplash.com/photo-1516979187457-637abb4f9353"},
    {title:"Midnight Library",category:"popular",price:450,img:"https://images.unsplash.com/photo-1519681393784-d120267933ba"}
];

const fantasyBooks=[
    {title:"The Snow Child",category:"fantasy",price:550,img:"https://images.unsplash.com/photo-1512820790803-83ca734da794"},
    {title:"Mistborn",category:"fantasy",price:699,img:"https://images.unsplash.com/photo-1524995997946-a1c2e315a42f"},
    {title:"Godkiller",category:"fantasy",price:620,img:"https://images.unsplash.com/photo-1495446815901-a7297e633e8d"}
];

const allBooks=[...popularBooks,...fantasyBooks];

/* DISPLAY */
function displayBooks(list,id){
    const container=document.getElementById(id);
    container.innerHTML="";
    list.forEach(book=>{
        container.innerHTML+=`
        <div class="book">
            <img src="${book.img}">
            <h3>${book.title}</h3>
            <p>₹${book.price}</p>
            <button onclick="addToCart('${book.title}')">Add to Cart</button>
        </div>`;
    });
}

/* SEARCH */
const searchInput=document.getElementById("searchInput");
const categoryFilter=document.getElementById("categoryFilter");

function filterBooks(){
    const text=searchInput.value.toLowerCase();
    const cat=categoryFilter.value;

    const filtered=allBooks.filter(b=>
        b.title.toLowerCase().includes(text) &&
        (cat==="all"||b.category===cat)
    );

    displayBooks(filtered,"popularContainer");
    document.getElementById("fantasyContainer").innerHTML="";
}

searchInput.addEventListener("keyup",filterBooks);
categoryFilter.addEventListener("change",filterBooks);

/* CART */
function getCart(){
    return JSON.parse(sessionStorage.getItem("cart"))||{};
}
function saveCart(c){
    sessionStorage.setItem("cart",JSON.stringify(c));
}

function showPopup(msg){
    const popup=document.getElementById("popup");
    popup.innerText=msg;
    popup.style.opacity=1;
    popup.style.transform='translateY(0)';
    setTimeout(()=>{
        popup.style.opacity=0;
        popup.style.transform='translateY(20px)';
    },2000);
}

function addToCart(title){
    let cart=getCart();
    cart[title]=(cart[title]||0)+1;
    saveCart(cart);
    showPopup(title+" added to cart!");
    updateCartUI();
}

function removeFromCart(title){
    let cart=getCart();
    delete cart[title];
    saveCart(cart);
    updateCartUI();
}

function updateCartUI(){
    const cart=getCart();
    const container=document.getElementById("cartContainer");
    const totalDiv=document.getElementById("totalAmount");

    container.innerHTML="";
    let total=0;

    if(Object.keys(cart).length===0){
        container.innerHTML="<p>Cart is empty</p>";
        totalDiv.innerHTML="";
        return;
    }

    for(let item in cart){
        const book=allBooks.find(b=>b.title===item);
        let qty=cart[item];
        let price=book.price*qty;
        total+=price;

        container.innerHTML+=`
        <div class="book">
            <h3>${item}</h3>
            <p>₹${book.price} × ${qty} = ₹${price}</p>
            <button onclick="removeFromCart('${item}')">Remove</button>
        </div>`;
    }

    totalDiv.innerHTML="Total: ₹"+total;
}

function checkout(){
    const cart=getCart();
    if(Object.keys(cart).length===0){
        alert("Cart is empty!");
        return;
    }
    alert("Order placed!");
    sessionStorage.clear();
    updateCartUI();
}

/* INIT */
displayBooks(popularBooks,"popularContainer");
displayBooks(fantasyBooks,"fantasyContainer");
updateCartUI();

</script>

</body>
</html>
